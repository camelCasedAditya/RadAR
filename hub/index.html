<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadAR Hub</title>
<style>
  :root { --bg:#0b0e12; --panel:#141a21; --line:#263140; --text:#d7e0ea; --dim:#7d8b99; --warn:#ff5a4f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; overflow:hidden; }
  #app { display:grid; grid-template-columns:1fr 340px; grid-template-rows:1fr auto; height:100%; }
  #view { position:relative; min-width:0; }
  #view canvas { display:block; }
  #transcript { position:absolute; left:12px; bottom:12px; width:min(520px, calc(100% - 24px)); max-height:35%; overflow-y:auto;
                padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:rgba(11,14,18,.85); }
  #transcript[hidden] { display:none; }
  #transcript h3 { margin:0 0 4px; font-size:inherit; color:var(--dim); font-weight:normal; }
  #transcript p { margin:2px 0; }
  #transcript p.partial { color:var(--dim); font-style:italic; }
  #transcript time { color:var(--dim); margin-right:6px; }
  #side { grid-row:1 / span 2; grid-column:2; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px; }
  .feed { border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .feed header { display:flex; align-items:center; gap:8px; padding:6px 8px; border-bottom:1px solid var(--line); }
  .feed .dot { width:10px; height:10px; border-radius:50%; }
  .feed img { display:block; width:100%; aspect-ratio:518/378; object-fit:cover; background:#000; }
  .feed canvas { display:none; width:100%; max-height:55vh; object-fit:contain; background:#000; }
  .feed.has-video canvas { display:block; }
  .feed.has-video img { display:none; }
  .feed .meta { color:var(--dim); margin-left:auto; }
  .feed .vid { position:relative; }
  .feed .hr { position:absolute; top:8px; left:8px; padding:2px 8px; border-radius:4px; background:rgba(0,0,0,.65); color:#ff5a6e; font-weight:bold; }
  .feed .hr.stale { color:var(--dim); }
  .feed .peers { position:absolute; inset:0; pointer-events:none; }
  .feed .peer { position:absolute; transform:translate(-50%,-50%); padding:1px 6px; border-radius:4px; background:rgba(0,0,0,.6); font-weight:bold; white-space:nowrap; }
  .feed .peer i { display:inline-block; font-style:normal; font-size:1.4em; line-height:1; margin-right:4px; }
  .feed .mic { animation: blink 1.2s step-start infinite; }
  #status { grid-column:1; display:flex; gap:18px; padding:6px 12px; border-top:1px solid var(--line); background:var(--panel); white-space:nowrap; overflow-x:auto; }
  #status .warn { color:var(--warn); }
  #conn { position:absolute; top:10px; left:12px; color:var(--dim); }
  #rec { position:absolute; top:10px; left:60px; color:var(--warn); }
  #rec.saved { color:var(--text); }
  #rec[hidden] { display:none; }
  #record.on { border-color:var(--warn); color:var(--warn); }
  @keyframes blink { 50% { opacity:0.25; } }
  #rec b { animation: blink 1.2s step-start infinite; }
  #controls { position:absolute; top:8px; right:10px; display:flex; gap:6px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 8px; font:inherit; cursor:pointer; }
  button[aria-pressed="true"] { border-color:var(--text); }
  #qr { position:absolute; top:44px; right:10px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px; align-items:center; max-width:300px; }
  #qr p { margin:0; color:var(--dim); }
  #qr-ids { display:flex; gap:6px; }
  #qr-img { background:#fff; padding:10px; border-radius:4px; line-height:0; }
  #qr-img svg { width:220px; height:220px; }
  #qr-url { word-break:break-all; color:var(--dim); }
  #qr[hidden], #mapsbox[hidden] { display:none; }
  #mapsbox { position:absolute; top:44px; right:10px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:320px; max-height:60vh; overflow-y:auto; }
  #mapsbox .row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
  #mapsbox ul { list-style:none; margin:0; padding:0; }
  #mapsbox li { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:4px 0; border-top:1px solid var(--line); }
  #mapsbox li .name { border:0; padding:4px 0; text-align:left; flex:1; font-weight:bold; }
  #mapsbox li .name:hover { text-decoration:underline; }
  #mapsbox li .meta { display:block; font-weight:normal; }
  #mapsbox .meta { color:var(--dim); }
  #mapsbox a { color:var(--text); text-decoration:none; padding:4px 6px; border:1px solid var(--line); border-radius:4px; }
  @media (max-width:760px) {
    #app { grid-template-columns:1fr; grid-template-rows:55vh auto auto; }
    #side { grid-row:3; grid-column:1; border-left:0; border-top:1px solid var(--line); }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="conn">connecting…</div>
    <div id="rec" hidden></div>
    <section id="transcript" hidden aria-label="Call transcript"><h3>Transcript</h3><div id="tx-lines" aria-live="polite"></div></section>
    <div id="controls"><button id="connect" aria-pressed="false">Connect</button><button id="record">● Record new map</button><button id="maps" aria-pressed="false">Past maps</button><button id="surface" aria-pressed="true">Surface: photos</button><span id="viewmode" hidden title="this map has an enhanced version: the same surfaces with sharper photos from the video"><button data-view="original" aria-pressed="true">Original</button><button data-view="enhanced" aria-pressed="false">Enhanced</button></span><button id="talk" aria-pressed="false" title="open your mic to everyone on the call; click again to stop">🎙 Talk</button><button id="tint" aria-pressed="false">Tint: off</button><button id="follow" aria-pressed="false">Follow: off</button></div>
    <div id="mapsbox" hidden>
      <div class="row"><b>Past maps</b><span class="meta" id="maps-where"></span></div>
      <ul id="maps-list"></ul>
    </div>
    <div id="qr" hidden>
      <p>Scan in the RadAR app (Scan button). Pick the responder ID first:</p>
      <div id="qr-ids"><button data-id="A" aria-pressed="true">A</button><button data-id="B" aria-pressed="false">B</button><button data-id="C" aria-pressed="false">C</button><button data-id="" aria-pressed="false">no ID</button></div>
      <div id="qr-img"></div>
      <code id="qr-url"></code>
    </div>
  </div>
  <aside id="side"></aside>
  <div id="status"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
